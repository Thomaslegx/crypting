<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chat Rétro</title>
  
  <style>
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      margin: 0;
      padding: 0;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #f2f2f7; 
      color: #000;
    }

    #header { 
      background: rgba(255, 255, 255, 0.95);
      color: #1c1c1e; 
      text-align: center; 
      padding: 14px 0; 
      font-weight: 600; 
      font-size: 17px;
      position: fixed; 
      top: 0; 
      left: 0;
      right: 0;
      z-index: 10; 
      border-bottom: 1px solid #d1d1d6;
    }

    #messages { 
      list-style-type: none; 
      margin: 60px 0 75px 0; 
      padding: 12px; 
    }

    #messages li { 
      padding: 10px 14px; 
      margin-bottom: 10px; 
      background: #ffffff; 
      border-radius: 18px; 
      max-width: 75%; 
      word-wrap: break-word; 
      clear: both;
      float: left;
      color: #000;
      font-size: 15px;
      line-height: 1.4;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    #messages li.me { 
      background: #007aff; 
      color: #ffffff; 
      float: right;
      border-bottom-right-radius: 4px;
    }

    #messages li.other {
      background: #e5e5ea;
      border-bottom-left-radius: 4px;
    }

    .sender-name {
      font-size: 11px;
      color: #8e8e93;
      margin-bottom: 3px;
      display: block;
      font-weight: 500;
    }

    #messages li.me .sender-name {
      color: rgba(255, 255, 255, 0.8);
      text-align: right;
    }

    .chat-img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin-top: 4px;
      display: block;
    }

    #form { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      padding: 8px 10px; 
      background: rgba(249, 249, 249, 0.95); 
      display: flex; 
      align-items: center;
      border-top: 1px solid #d1d1d6; 
    }

    #pseudo { 
      width: 60px; 
      padding: 8px 6px; 
      border: 1px solid #c7c7cc; 
      border-radius: 18px; 
      margin-right: 4px; 
      font-size: 13px;
      background: #fff;
      text-align: center;
      outline: none;
    }

    #input { 
      flex: 1; 
      padding: 8px 10px; 
      border: 1px solid #c7c7cc; 
      border-radius: 18px; 
      font-size: 14px;
      background: #fff;
      outline: none;
    }

    .btn-photo {
      background: #8e8e93;
      color: white;
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-weight: bold;
      font-size: 18px;
      margin-left: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #btn { 
      padding: 8px 12px; 
      margin-left: 4px; 
      background: #007aff; 
      color: white; 
      border: none; 
      border-radius: 18px; 
      font-weight: 600; 
      font-size: 13px;
      cursor: pointer;
    }

    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <div id="header">Messagerie Rétro</div>

  <ul id="messages"></ul>

  <form id="form" action="">
    <input id="pseudo" placeholder="Nom" value="i4" maxlength="10" />
    <input id="input" autocomplete="off" placeholder="Message..." />
    
    <label for="file-input" class="btn-photo">📷</label>
    <input type="file" id="file-input" accept="image/*">

    <button id="btn" type="submit">Envoyer</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();
    var form = document.getElementById('form');
    var input = document.getElementById('input');
    var pseudo = document.getElementById('pseudo');
    var messages = document.getElementById('messages');
    var fileInput = document.getElementById('file-input');

    // Compression et réduction de l'image (compatibilité ES5)
    function compressAndSend(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');

          var maxWidth = 600;
          var maxHeight = 600;
          var width = img.width;
          var height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height *= maxWidth / width;
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width *= maxHeight / height;
              height = maxHeight;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // Conversion en JPEG léger à 50% de qualité
          var compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);

          socket.emit('chat message', {
            user: pseudo.value || 'Anonyme',
            text: null,
            image: compressedBase64
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    form.onsubmit = function(e) {
      if (e && e.preventDefault) e.preventDefault();
      if (input.value) {
        socket.emit('chat message', {
          user: pseudo.value || 'Anonyme',
          text: input.value,
          image: null
        });
        input.value = '';
      }
      return false;
    };

    fileInput.onchange = function(e) {
      var file = e.target.files[0];
      if (file) {
        compressAndSend(file);
        fileInput.value = ''; 
      }
    };

    socket.on('chat message', function(data) {
      var item = document.createElement('li');
      var isMe = data.user === pseudo.value;
      
      item.className = isMe ? 'me' : 'other';

      var nameSpan = document.createElement('span');
      nameSpan.className = 'sender-name';
      nameSpan.textContent = data.user;
      item.appendChild(nameSpan);

      if (data.text) {
        var textNode = document.createTextNode(data.text);
        item.appendChild(textNode);
      }

      if (data.image) {
        var img = document.createElement('img');
        img.src = data.image;
        img.className = 'chat-img';
        
        img.onload = function() {
          window.scrollTo(0, document.body.scrollHeight);
        };
        
        item.appendChild(img);
      }

      messages.appendChild(item);
      
      var clear = document.createElement('div');
      clear.style.clear = 'both';
      messages.appendChild(clear);

      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
