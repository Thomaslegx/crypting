<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Crypting</title>
  
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
    }

    html, body {
      width: 320px;
      height: 100%;
      max-height: 480px;
      background-color: #000;
      color: #dedede;
      overflow: hidden;
      font-size: 12px;
      margin: 0 auto;
    }

    body {
      display: -webkit-box;
      display: flex;
    }

    /* --- SIDEBAR / CONTACTS --- */
    #sidebar {
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: -webkit-box;
      display: flex;
      -webkit-box-orient: vertical;
      flex-direction: column;
    }

    .sidebar-header {
      height: 38px;
      padding: 0 8px;
      background-color: #181818;
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      -webkit-box-pack: justify;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }

    .brand {
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      font-weight: bold;
      font-size: 13px;
      color: #fff;
    }

    .logo-ghost {
      width: 22px;
      height: 22px;
      background-color: #fffc00;
      border-radius: 50%;
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      -webkit-box-pack: center;
      justify-content: center;
      font-size: 12px;
      margin-right: 6px;
    }

    .header-actions {
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
    }

    .btn-settings {
      background: none;
      border: none;
      font-size: 15px;
      color: #aaa;
      padding: 4px;
      margin-right: 2px;
      cursor: pointer;
    }

    .btn-add-friend {
      background: #262626;
      color: #fffc00;
      border: none;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .friends-list {
      -webkit-box-flex: 1;
      flex: 1;
      overflow-y: auto;
      list-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .friend-item {
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      padding: 8px 8px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
    }

    .friend-item:active {
      background-color: #1f1f1f;
    }

    .avatar {
      width: 30px;
      height: 30px;
      background-color: #fffc00;
      color: #000;
      border-radius: 50%;
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      -webkit-box-pack: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      margin-right: 8px;
    }

    .friend-info {
      -webkit-box-flex: 1;
      flex: 1;
      overflow: hidden;
    }

    .friend-name {
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }

    .last-message {
      font-size: 10px;
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      padding: 20px 10px;
      text-align: center;
      color: #666;
      font-size: 11px;
    }

    /* --- CHAT --- */
    #chat-main {
      width: 100%;
      height: 100%;
      display: none;
      -webkit-box-orient: vertical;
      flex-direction: column;
      background-color: #0b0b0b;
    }

    #chat-header {
      height: 38px;
      background-color: #121212;
      padding: 0 8px;
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      -webkit-box-pack: justify;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }

    .chat-header-user {
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
    }

    .active-user-title {
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }

    .btn-call {
      background: #222;
      color: #fffc00;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* BANDEAU WEBRTC IPONE 4 */
    #call-bar {
      display: none;
      background-color: #1c1c1e;
      border-bottom: 1px solid #333;
      padding: 6px;
      text-align: center;
    }

    .call-status {
      font-size: 11px;
      color: #fffc00;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .call-actions {
      display: -webkit-box;
      display: flex;
      -webkit-box-pack: center;
      justify-content: center;
    }

    .btn-call-accept {
      background: #34c759;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 11px;
      margin-right: 6px;
      cursor: pointer;
    }

    .btn-call-reject {
      background: #ff3b30;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    #messages-container {
      -webkit-box-flex: 1;
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .message-item {
      margin-bottom: 6px;
      clear: both;
      max-width: 85%;
    }

    .message-item.me { float: right; }
    .message-item.other { float: left; }

    .bubble {
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12px;
      word-break: break-word;
    }

    .me .bubble {
      background-color: #fffc00;
      color: #000;
      font-weight: 500;
    }

    .other .bubble {
      background-color: #222;
      color: #fff;
    }

    .chat-img {
      max-width: 140px;
      border-radius: 6px;
      margin-top: 3px;
      border: 1px solid #333;
      display: block;
    }

    /* BARRE DE SAISIE COMPACTE */
    #form-bar {
      height: 40px;
      padding: 0 4px;
      background-color: #121212;
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      border-top: 1px solid #222;
    }

    #input-message {
      -webkit-box-flex: 1;
      flex: 1;
      background-color: #1a1a1a;
      border: none;
      padding: 6px 10px;
      border-radius: 14px;
      color: #fff;
      font-size: 11px;
      outline: none;
      margin: 0 4px;
      -webkit-user-select: text;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 16px;
      color: #888;
      padding: 2px 4px;
      cursor: pointer;
    }

    #btn-send {
      background-color: #fffc00;
      color: #000;
      border: none;
      padding: 5px 8px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 10px;
      cursor: pointer;
    }

    #file-input { display: none; }

    body.in-chat #sidebar { display: none; }
    body.in-chat #chat-main { display: -webkit-box; display: flex; }

    /* MODALES */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
    }

    #settings-modal {
      text-align: center;
      padding: 20px 10px;
    }

    .settings-box {
      background: #181818;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 15px 10px;
      margin-top: 30px;
    }

    .settings-title {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 10px;
    }

    .user-tag {
      font-size: 11px;
      color: #fffc00;
      margin-bottom: 12px;
    }

    .btn-danger {
      background-color: #ff3b30;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 11px;
      width: 100%;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .btn-cancel {
      background-color: #262626;
      color: #aaa;
      border: none;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      width: 100%;
      cursor: pointer;
    }

    #camera-modal {
      text-align: center;
      background: #000;
    }

    #video-preview {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background: #111;
    }

    .camera-controls {
      height: 80px;
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      -webkit-box-pack: justify;
      justify-content: space-around;
    }

    .btn-snap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: transparent;
    }

    .btn-close-cam {
      color: #fff;
      background: #333;
      border: none;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <audio id="remote-audio" autoplay playsinline></audio>

  <!-- ÉCRAN 1 : CONTACTS -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="logo-ghost">👻</div>
        <span>Crypting</span>
      </div>
      <div class="header-actions">
        <button class="btn-settings" onclick="openSettings()" title="Réglages">⚙️</button>
        <button class="btn-add-friend" onclick="addFriend()">+ Ajouter</button>
      </div>
    </div>
    <ul class="friends-list" id="friends-list"></ul>
  </div>

  <!-- ÉCRAN 2 : CHAT -->
  <div id="chat-main">
    <div id="chat-header">
      <div class="chat-header-user">
        <button class="action-btn" onclick="closeChat()" style="margin-right:6px;">←</button>
        <span class="active-user-title" id="active-user-title">Discussion</span>
      </div>
      <button class="btn-call" onclick="startCall()">📞 Appeler</button>
    </div>

    <div id="call-bar">
      <div class="call-status" id="call-status-text">Appel en cours...</div>
      <div class="call-actions">
        <button class="btn-call-accept" id="btn-accept-call" onclick="acceptCall()" style="display:none;">Décrocher</button>
        <button class="btn-call-reject" onclick="endCall()">Raccrocher</button>
      </div>
    </div>

    <div id="messages-container"></div>

    <div id="form-bar">
      <button type="button" class="action-btn" onclick="openCamera()">📷</button>
      <label for="file-input" class="action-btn">📁</label>
      <input type="file" id="file-input" accept="image/*">

      <input id="input-message" autocomplete="off" placeholder="Message..." />
      <button id="btn-send" type="button" onclick="triggerSend()">OK</button>
    </div>
  </div>

  <!-- RÉGLAGES -->
  <div id="settings-modal" class="modal-overlay">
    <div class="settings-box">
      <div class="settings-title">Réglages</div>
      <div class="user-tag" id="my-username-display">Mon pseudo : -</div>
      <button class="btn-danger" onclick="clearBrowserCache()">🗑️ Effacer le cache</button>
      <button class="btn-cancel" onclick="closeSettings()">Fermer</button>
    </div>
  </div>

  <!-- CAMÉRA -->
  <div id="camera-modal" class="modal-overlay">
    <video id="video-preview" autoplay playsinline></video>
    <div class="camera-controls">
      <button class="btn-close-cam" onclick="closeCamera()">Annuler</button>
      <button class="btn-snap" onclick="takeSnap()"></button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();
    var currentFriend = null;

    function getStoredData(key, fallback) {
      var data = localStorage.getItem(key);
      return data ? JSON.parse(data) : fallback;
    }

    function setStoredData(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    var myUsername = localStorage.getItem('crypting_username');
    while (!myUsername || myUsername.replace(/^\s+|\s+$/g, '') === '') {
      myUsername = prompt("Entre ton pseudo (ex: iphone4) :");
    }
    myUsername = myUsername.replace(/^\s+|\s+$/g, '').toLowerCase();
    localStorage.setItem('crypting_username', myUsername);

    socket.emit('register user', myUsername);

    var friends = getStoredData('crypting_friends', []);
    var chats = getStoredData('crypting_chats', {});

    function openSettings() {
      document.getElementById('my-username-display').textContent = 'Mon pseudo : ' + myUsername;
      document.getElementById('settings-modal').style.display = 'block';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function clearBrowserCache() {
      if (confirm("Effacer les données enregistrées ?")) {
        localStorage.clear();
        location.reload();
      }
    }

    function renderFriendsList() {
      var listEl = document.getElementById('friends-list');
      listEl.innerHTML = '';

      if (friends.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Aucun ami.<br>Clique sur <b>"+ Ajouter"</b>.</div>';
        return;
      }

      for (var i = 0; i < friends.length; i++) {
        (function(friendName) {
          var li = document.createElement('li');
          li.className = 'friend-item';

          var friendMsgs = chats[friendName] || [];
          var lastMsg = friendMsgs.length > 0 ? friendMsgs[friendMsgs.length - 1] : null;
          var lastText = lastMsg ? (lastMsg.image ? '📷 Snap' : lastMsg.text) : 'Nouvelle discussion';

          li.innerHTML = 
            '<div class="avatar">' + friendName.charAt(0).toUpperCase() + '</div>' +
            '<div class="friend-info">' +
              '<div class="friend-name">' + friendName + '</div>' +
              '<div class="last-message">' + lastText + '</div>' +
            '</div>';

          li.onclick = function() {
            openChat(friendName);
          };

          listEl.appendChild(li);
        })(friends[i]);
      }
    }

    function addFriend() {
      var name = prompt("Nom exact de l'ami :");
      if (name) {
        var cleanName = name.replace(/^\s+|\s+$/g, '').toLowerCase();
        if (cleanName !== "") {
          if (friends.indexOf(cleanName) === -1) {
            friends.push(cleanName);
            setStoredData('crypting_friends', friends);
          }
          openChat(cleanName);
        }
      }
    }

    function openChat(friendName) {
      currentFriend = friendName.toLowerCase();
      document.getElementById('active-user-title').textContent = currentFriend;
      document.body.className = 'in-chat';
      renderMessages();
    }

    function closeChat() {
      document.body.className = '';
      currentFriend = null;
      renderFriendsList();
    }

    function renderMessages() {
      var container = document.getElementById('messages-container');
      container.innerHTML = '';

      if (!currentFriend) return;

      var msgs = chats[currentFriend] || [];

      for (var i = 0; i < msgs.length; i++) {
        var msg = msgs[i];
        var div = document.createElement('div');
        div.className = 'message-item ' + (msg.sender === 'me' ? 'me' : 'other');

        if (msg.text) {
          var bubble = document.createElement('div');
          bubble.className = 'bubble';
          bubble.textContent = msg.text;
          div.appendChild(bubble);
        }

        if (msg.image) {
          var img = document.createElement('img');
          img.src = msg.image;
          img.className = 'chat-img';
          div.appendChild(img);
        }

        container.appendChild(div);
      }

      var clearDiv = document.createElement('div');
      clearDiv.style.clear = 'both';
      container.appendChild(clearDiv);

      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('input-message').onkeypress = function(e) {
      e = e || window.event;
      var charCode = e.keyCode || e.which;
      if (charCode === 13) {
        triggerSend();
        return false;
      }
    };

    function triggerSend() {
      var input = document.getElementById('input-message');
      var val = input.value;
      if (val) { val = val.replace(/^\s+|\s+$/g, ''); }

      if (val && val !== '') {
        sendMessage(val, null);
        input.value = '';
      }
    }

    function sendMessage(text, image) {
      if (!currentFriend) return;
      if (!chats[currentFriend]) chats[currentFriend] = [];

      chats[currentFriend].push({
        sender: 'me',
        text: text,
        image: image,
        timestamp: new Date().getTime()
      });

      setStoredData('crypting_chats', chats);

      socket.emit('chat message', {
        sender: String(myUsername),
        target: String(currentFriend),
        text: text ? String(text) : null,
        image: image ? String(image) : null
      });

      renderMessages();
    }

    /* WEBRTC IPONE 4 FIX */
    var peerConnection = null;
    var localStream = null;
    var incomingOffer = null;
    var callingFriend = null;
    var iceCandidatesQueue = [];

    var rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function unlockAudio() {
      var remoteAudio = document.getElementById('remote-audio');
      remoteAudio.play().catch(function(){});
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = function(event) {
        var remoteAudio = document.getElementById('remote-audio');
        if (event.streams && event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          remoteAudio.play().catch(function(e){});
        }
      };

      peerConnection.onicecandidate = function(event) {
        if (event.candidate && callingFriend) {
          socket.emit('ice-candidate', { target: callingFriend, candidate: event.candidate });
        }
      };
    }

    function processIceCandidates() {
      while (iceCandidatesQueue.length > 0) {
        var cand = iceCandidatesQueue.shift();
        peerConnection.addIceCandidate(new RTCIceCandidate(cand)).catch(function(e){});
      }
    }

    function startCall() {
      if (!currentFriend) {
        alert("Sélectionne un ami.");
        return;
      }
      unlockAudio();
      callingFriend = currentFriend.toLowerCase();
      document.getElementById('call-bar').style.display = 'block';
      document.getElementById('call-status-text').textContent = 'Appel de ' + callingFriend + '...';
      document.getElementById('btn-accept-call').style.display = 'none';

      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function(stream) {
        localStream = stream;
        createPeerConnection();

        localStream.getTracks().forEach(function(track) {
          peerConnection.addTrack(track, localStream);
        });

        return peerConnection.createOffer();
      }).then(function(offer) {
        return peerConnection.setLocalDescription(offer);
      }).then(function() {
        socket.emit('call-user', { target: callingFriend, offer: peerConnection.localDescription });
      }).catch(function(err) {
        alert("Micro indisponible : " + err.message);
        endCall();
      });
    }

    socket.on('incoming-call', function(data) {
      callingFriend = String(data.from).toLowerCase();
      incomingOffer = data.offer;

      if (!currentFriend || currentFriend !== callingFriend) {
        openChat(callingFriend);
      }

      document.getElementById('call-bar').style.display = 'block';
      document.getElementById('call-status-text').textContent = '📞 Appel de ' + callingFriend;
      document.getElementById('btn-accept-call').style.display = 'inline-block';
    });

    function acceptCall() {
      unlockAudio();
      document.getElementById('btn-accept-call').style.display = 'none';
      document.getElementById('call-status-text').textContent = 'En ligne avec ' + callingFriend;

      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function(stream) {
        localStream = stream;
        createPeerConnection();

        localStream.getTracks().forEach(function(track) {
          peerConnection.addTrack(track, localStream);
        });

        return peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
      }).then(function() {
        processIceCandidates();
        return peerConnection.createAnswer();
      }).then(function(answer) {
        return peerConnection.setLocalDescription(answer);
      }).then(function() {
        socket.emit('answer-call', { target: callingFriend, answer: peerConnection.localDescription });
      }).catch(function(err) {
        alert("Micro indisponible : " + err.message);
        endCall();
      });
    }

    socket.on('call-answered', function(data) {
      document.getElementById('call-status-text').textContent = 'En ligne avec ' + callingFriend;
      if (peerConnection && data.answer) {
        peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer)).then(function() {
          processIceCandidates();
        });
      }
    });

    socket.on('ice-candidate', function(data) {
      if (data.candidate) {
        if (peerConnection && peerConnection.remoteDescription) {
          peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(function(e){});
        } else {
          iceCandidatesQueue.push(data.candidate);
        }
      }
    });

    socket.on('call-ended', function() {
      closeCallBar();
    });

    function endCall() {
      if (callingFriend) {
        socket.emit('end-call', { target: callingFriend });
      }
      closeCallBar();
    }

    function closeCallBar() {
      document.getElementById('call-bar').style.display = 'none';
      iceCandidatesQueue = [];
      if (localStream) {
        localStream.getTracks().forEach(function(track) { track.stop(); });
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      callingFriend = null;
    }

    socket.on('chat message', function(data) {
      var sender = data.sender;
      if (!sender) return;

      if (friends.indexOf(sender) === -1) {
        friends.push(sender);
        setStoredData('crypting_friends', friends);
      }

      if (!chats[sender]) chats[sender] = [];

      chats[sender].push({
        sender: 'other',
        text: data.text,
        image: data.image,
        timestamp: new Date().getTime()
      });

      setStoredData('crypting_chats', chats);

      if (currentFriend === sender) {
        renderMessages();
      }
      renderFriendsList();
    });

    socket.on('connect', function() {
      if (myUsername) {
        socket.emit('register user', myUsername);
      }
    });

    document.getElementById('file-input').onchange = function(e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(evt) {
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            var maxDim = 320; // Compression ajustée pour le processeur de l'iPhone 4
            var w = img.width, h = img.height;

            if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }

            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);

            sendMessage(null, canvas.toDataURL('image/jpeg', 0.4));
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    var mediaStream = null;
    function openCamera() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true }).then(function(stream) {
          mediaStream = stream;
          document.getElementById('video-preview').srcObject = stream;
          document.getElementById('camera-modal').style.display = 'block';
        }).catch(function() {
          alert("Caméra indisponible.");
        });
      } else {
        alert("Utilise 📁 pour envoyer une image.");
      }
    }

    function closeCamera() {
      if (mediaStream && mediaStream.getTracks) {
        var tracks = mediaStream.getTracks();
        for (var i = 0; i < tracks.length; i++) tracks[i].stop();
      }
      document.getElementById('camera-modal').style.display = 'none';
    }

    function takeSnap() {
      var video = document.getElementById('video-preview');
      var canvas = document.createElement('canvas');
      canvas.width = 240;
      canvas.height = 280;
      canvas.getContext('2d').drawImage(video, 0, 0, 240, 280);

      sendMessage(null, canvas.toDataURL('image/jpeg', 0.4));
      closeCamera();
    }

    renderFriendsList();
  </script>
</body>
</html>
