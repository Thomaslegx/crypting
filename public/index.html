<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chat Rétro</title>
  
  <style>
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      margin: 0;
      padding: 0;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #f2f2f7; 
      color: #000;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* En-tête élégant */
    #header { 
      background: rgba(255, 255, 255, 0.95);
      color: #1c1c1e; 
      text-align: center; 
      padding: 14px 0; 
      font-weight: 600; 
      font-size: 17px;
      position: fixed; 
      top: 0; 
      left: 0;
      right: 0;
      z-index: 10; 
      border-bottom: 1px solid #d1d1d6;
    }

    /* Zone des messages */
    #messages { 
      list-style-type: none; 
      margin: 60px 0 70px 0; 
      padding: 12px; 
      overflow-y: auto;
    }

    #messages li { 
      padding: 10px 14px; 
      margin-bottom: 10px; 
      background: #ffffff; 
      border-radius: 18px; 
      max-width: 75%; 
      word-wrap: break-word; 
      clear: both;
      float: left;
      color: #000;
      font-size: 15px;
      line-height: 1.4;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    /* Bulles utilisateur ("Moi") */
    #messages li.me { 
      background: #007aff; 
      color: #ffffff; 
      float: right;
      border-bottom-right-radius: 4px;
    }

    /* Bulles des autres utilisateurs */
    #messages li.other {
      background: #e5e5ea;
      border-bottom-left-radius: 4px;
    }

    .sender-name {
      font-size: 11px;
      color: #8e8e93;
      margin-bottom: 3px;
      display: block;
      font-weight: 500;
    }

    #messages li.me .sender-name {
      color: rgba(255, 255, 255, 0.8);
      text-align: right;
    }

    /* Barre d'envoi en bas */
    #form { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      padding: 8px 10px; 
      background: rgba(249, 249, 249, 0.95); 
      display: flex; 
      align-items: center;
      border-top: 1px solid #d1d1d6; 
    }

    #pseudo { 
      width: 75px; 
      padding: 8px 10px; 
      border: 1px solid #c7c7cc; 
      border-radius: 18px; 
      margin-right: 6px; 
      font-size: 14px;
      background: #fff;
      text-align: center;
      outline: none;
    }

    #input { 
      flex: 1; 
      padding: 8px 12px; 
      border: 1px solid #c7c7cc; 
      border-radius: 18px; 
      font-size: 14px;
      background: #fff;
      outline: none;
    }

    #input:focus, #pseudo:focus {
      border-color: #007aff;
    }

    #btn { 
      padding: 8px 14px; 
      margin-left: 6px; 
      background: #007aff; 
      color: white; 
      border: none; 
      border-radius: 18px; 
      font-weight: 600; 
      font-size: 14px;
      cursor: pointer;
    }

    #btn:active {
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div id="header">Messagerie Rétro</div>

  <ul id="messages"></ul>

  <form id="form" action="">
    <input id="pseudo" placeholder="Nom" value="i4" maxlength="10" />
    <input id="input" autocomplete="off" placeholder="Message..." />
    <button id="btn" type="submit">Envoyer</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Syntaxe ES5 stricte pour iOS 7.1.2
    var socket = io();
    var form = document.getElementById('form');
    var input = document.getElementById('input');
    var pseudo = document.getElementById('pseudo');
    var messages = document.getElementById('messages');

    form.onsubmit = function(e) {
      if (e && e.preventDefault) e.preventDefault();
      if (input.value) {
        socket.emit('chat message', {
          user: pseudo.value || 'Anonyme',
          text: input.value
        });
        input.value = '';
      }
      return false;
    };

    socket.on('chat message', function(data) {
      var item = document.createElement('li');
      var isMe = data.user === pseudo.value;
      
      item.className = isMe ? 'me' : 'other';

      // Affichage du nom de l'expéditeur au-dessus du message
      var nameSpan = document.createElement('span');
      nameSpan.className = 'sender-name';
      nameSpan.textContent = data.user;
      
      var textNode = document.createTextNode(data.text);

      item.appendChild(nameSpan);
      item.appendChild(textNode);
      messages.appendChild(item);
      
      // Séparateur Float pour assurer l'empilement propre des bulles
      var clear = document.createElement('div');
      clear.style.clear = 'both';
      messages.appendChild(clear);

      // Défilement automatique fluide vers le bas
      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
