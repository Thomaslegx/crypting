<!DOCTYPE html>
<html lang="fr" theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Crypting</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121212;
      color: #dedede;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* En-tête style Snapchat */
    #header {
      height: 60px;
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #2a2a2a;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
    }

    .logo-ghost {
      width: 32px;
      height: 32px;
      background-color: #fffc00;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .user-profile {
      background: #2a2a2a;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #fffc00;
      font-weight: 600;
      cursor: pointer;
    }

    /* Zone de Chat */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      list-style: none;
    }

    .message-item {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-item.me {
      align-self: flex-end;
    }

    .message-item.other {
      align-self: flex-start;
    }

    .sender-name {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .me .sender-name {
      text-align: right;
      color: #0084ff;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .me .bubble {
      background-color: #0084ff;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .other .bubble {
      background-color: #262626;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .chat-img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 4px;
      border: 1px solid #333;
    }

    /* Interface Caméra / Modal */
    #camera-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
    }

    #video-preview {
      width: 100%;
      height: 75vh;
      object-fit: cover;
    }

    .camera-controls {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .btn-snap {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      cursor: pointer;
    }

    .btn-snap:active {
      background: #fffc00;
    }

    .btn-close-cam {
      color: #fff;
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Barre d'action en bas */
    #form-bar {
      padding: 12px 16px;
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #2a2a2a;
    }

    #input-message {
      flex: 1;
      background-color: #262626;
      border: none;
      padding: 12px 16px;
      border-radius: 24px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    #input-message::placeholder {
      color: #777;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #888;
      transition: color 0.2s;
    }

    .action-btn:hover {
      color: #fffc00;
    }

    #btn-send {
      background-color: #fffc00;
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    #file-input { display: none; }
  </style>
</head>
<body>

  <!-- En-tête -->
  <div id="header">
    <div class="brand">
      <div class="logo-ghost">👻</div>
      <span>Crypting</span>
    </div>
    <div class="user-profile" id="user-display" onclick="changeUsername()">
      Mon Profil
    </div>
  </div>

  <!-- Messages -->
  <ul id="messages"></ul>

  <!-- Interface Caméra (Optionnelle/Modale) -->
  <div id="camera-modal">
    <video id="video-preview" autoplay playsinline></video>
    <div class="camera-controls">
      <button class="btn-close-cam" onclick="closeCamera()">Fermer</button>
      <button class="btn-snap" onclick="takeSnap()"></button>
    </div>
  </div>

  <!-- Formulaire / Bar de saisie -->
  <form id="form-bar" action="">
    <button type="button" class="action-btn" onclick="openCamera()">📷</button>
    <label for="file-input" class="action-btn">📁</label>
    <input type="file" id="file-input" accept="image/*">
    
    <input id="input-message" autocomplete="off" placeholder="Envoyer un Chat..." />
    <button id="btn-send" type="submit">Envoyer</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();
    var form = document.getElementById('form-bar');
    var input = document.getElementById('input-message');
    var messages = document.getElementById('messages');
    var fileInput = document.getElementById('file-input');
    var userDisplay = document.getElementById('user-display');
    var cameraModal = document.getElementById('camera-modal');
    var videoPreview = document.getElementById('video-preview');
    var mediaStream = null;

    // --- GESTION PSEUDO ---
    var currentName = localStorage.getItem('chat_username');
    if (!currentName) {
      currentName = prompt("Choisis ton Pseudo Snap :", "") || "Snapuser";
      localStorage.setItem('chat_username', currentName);
    }
    userDisplay.textContent = currentName;

    function changeUsername() {
      var newName = prompt("Nouveau pseudo :", currentName);
      if (newName && newName.trim() !== "") {
        currentName = newName.trim();
        localStorage.setItem('chat_username', currentName);
        userDisplay.textContent = currentName;
      }
    }

    // --- ENVOI DES MESSAGES ---
    form.onsubmit = function(e) {
      if (e) e.preventDefault();
      if (input.value.trim() !== '') {
        socket.emit('chat message', {
          user: currentName,
          text: input.value,
          image: null
        });
        input.value = '';
      }
      return false;
    };

    // --- RECUPERATION DES MESSAGES ---
    socket.on('chat message', function(data) {
      var li = document.createElement('li');
      var isMe = data.user === currentName;
      
      li.className = 'message-item ' + (isMe ? 'me' : 'other');

      var nameSpan = document.createElement('span');
      nameSpan.className = 'sender-name';
      nameSpan.textContent = data.user;
      li.appendChild(nameSpan);

      if (data.text) {
        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = data.text;
        li.appendChild(bubble);
      }

      if (data.image) {
        var img = document.createElement('img');
        img.src = data.image;
        img.className = 'chat-img';
        img.onload = function() {
          messages.scrollTop = messages.scrollHeight;
        };
        li.appendChild(img);
      }

      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    });

    // --- ENVOI DE FICHIER IMAGE ---
    fileInput.onchange = function(e) {
      var file = e.target.files[0];
      if (file) {
        compressAndSend(file);
        fileInput.value = '';
      }
    };

    function compressAndSend(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          var maxDim = 800;
          var w = img.width, h = img.height;

          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h > maxDim) { w *= maxDim / h; h = maxDim; }

          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);

          socket.emit('chat message', {
            user: currentName,
            text: null,
            image: canvas.toDataURL('image/jpeg', 0.6)
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- APPAREIL PHOTO EN DIRECT (Webcam/Mobile) ---
    async function openCamera() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        videoPreview.srcObject = mediaStream;
        cameraModal.style.display = 'flex';
      } catch (err) {
        alert("Impossible d'accéder à la caméra.");
      }
    }

    function closeCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      cameraModal.style.display = 'none';
    }

    function takeSnap() {
      var canvas = document.createElement('canvas');
      canvas.width = videoPreview.videoWidth;
      canvas.height = videoPreview.videoHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(videoPreview, 0, 0);

      socket.emit('chat message', {
        user: currentName,
        text: null,
        image: canvas.toDataURL('image/jpeg', 0.6)
      });

      closeCamera();
    }
  </script>
</body>
</html>
