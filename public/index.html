<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Crypting</title>
  
  <style>
    :root {
      --bg-color: #000000;
      --surface-color: #121212;
      --surface-hover: #1a1a1a;
      --border-color: #222222;
      --accent-color: #fffc00;
      --accent-hover: #e6e300;
      --text-main: #dedede;
      --text-muted: #777777;
      --danger-color: #ff3b30;
      --success-color: #34c759;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
      font-size: 14px;
    }

    body {
      display: flex;
      flex-direction: row;
    }

    /* --- SIDEBAR / LISTE CONTACTS --- */
    #sidebar {
      width: 100%;
      height: 100%;
      background-color: var(--surface-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .sidebar-header {
      padding: env(safe-area-inset-top, 12px) 16px 12px 16px;
      background-color: #181818;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .logo-ghost {
      width: 30px;
      height: 30px;
      background-color: var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      margin-right: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-settings {
      background: none;
      border: none;
      font-size: 18px;
      color: #aaa;
      padding: 6px;
      cursor: pointer;
    }

    .btn-add-friend {
      background: #262626;
      color: var(--accent-color);
      border: none;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add-friend:hover {
      background: #333;
    }

    .friends-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .friend-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .friend-item:active, .friend-item:hover {
      background-color: var(--surface-hover);
    }

    .avatar {
      width: 40px;
      height: 40px;
      background-color: var(--accent-color);
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .friend-info {
      flex: 1;
      overflow: hidden;
    }

    .friend-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .last-message {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* --- ZONE CHAT --- */
    #chat-main {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      background-color: #0b0b0b;
    }

    #chat-header {
      padding: env(safe-area-inset-top, 12px) 16px 12px 16px;
      background-color: var(--surface-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .chat-header-user {
      display: flex;
      align-items: center;
    }

    .active-user-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .btn-call {
      background: #222;
      color: var(--accent-color);
      border: 1px solid #333;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* BANDEAU WEBRTC */
    #call-bar {
      display: none;
      background-color: #1c1c1e;
      border-bottom: 1px solid var(--border-color);
      padding: 12px;
      text-align: center;
    }

    .call-status {
      font-size: 13px;
      color: var(--accent-color);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .call-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-call-accept {
      background: var(--success-color);
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-call-reject {
      background: var(--danger-color);
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    #messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-item {
      max-width: 75%;
      display: flex;
      flex-direction: column;
    }

    .message-item.me { align-self: flex-end; }
    .message-item.other { align-self: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      word-break: break-word;
      line-height: 1.4;
    }

    .me .bubble {
      background-color: var(--accent-color);
      color: #000;
      font-weight: 500;
      border-bottom-right-radius: 4px;
    }

    .other .bubble {
      background-color: #222;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .chat-img {
      max-width: 220px;
      border-radius: 12px;
      margin-top: 4px;
      border: 1px solid var(--border-color);
    }

    /* BARRE DE SAISIE */
    #form-bar {
      padding: 10px 12px env(safe-area-inset-bottom, 10px) 12px;
      background-color: var(--surface-color);
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--border-color);
    }

    #input-message {
      flex: 1;
      background-color: var(--surface-hover);
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #888;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #btn-send {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #btn-send:hover {
      background-color: var(--accent-hover);
    }

    #file-input { display: none; }

    /* --- GESTION ADAPTATIVE RESPONSIVE --- */
    @media (max-width: 767px) {
      body.in-chat #sidebar { display: none; }
      body.in-chat #chat-main { display: flex; }
    }

    @media (min-width: 768px) {
      #sidebar {
        width: 340px;
        min-width: 340px;
        border-right: 1px solid var(--border-color);
      }
      #chat-main {
        display: flex !important;
        flex: 1;
      }
      .btn-back { display: none !important; }
    }

    /* MODALES MODERNES */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .settings-box {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 340px;
      text-align: center;
    }

    .settings-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }

    .user-tag {
      font-size: 13px;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 13px;
      width: 100%;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .btn-cancel {
      background-color: #262626;
      color: #aaa;
      border: none;
      padding: 10px;
      border-radius: 14px;
      font-size: 13px;
      width: 100%;
      cursor: pointer;
    }

    #camera-modal {
      flex-direction: column;
      background: #000;
    }

    #video-preview {
      width: 100%;
      max-width: 500px;
      height: 70vh;
      object-fit: cover;
      background: #111;
    }

    .camera-controls {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      max-width: 500px;
    }

    .btn-snap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      cursor: pointer;
    }

    .btn-close-cam {
      color: #fff;
      background: #333;
      border: none;
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <audio id="remote-audio" autoplay playsinline></audio>

  <div id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="logo-ghost">👻</div>
        <span>Crypting</span>
      </div>
      <div class="header-actions">
        <button class="btn-settings" onclick="openSettings()" title="Réglages">⚙️</button>
        <button class="btn-add-friend" onclick="addFriend()">+ Ajouter</button>
      </div>
    </div>
    <ul class="friends-list" id="friends-list"></ul>
  </div>

  <div id="chat-main">
    <div id="chat-header">
      <div class="chat-header-user">
        <button class="action-btn btn-back" onclick="closeChat()" style="margin-right:8px;">←</button>
        <span class="active-user-title" id="active-user-title">Sélectionne une discussion</span>
      </div>
      <button class="btn-call" id="btn-start-call" onclick="startCall()" style="display:none;">📞 Appeler</button>
    </div>

    <div id="call-bar">
      <div class="call-status" id="call-status-text">Appel en cours...</div>
      <div class="call-actions">
        <button class="btn-call-accept" id="btn-accept-call" onclick="acceptCall()" style="display:none;">Décrocher</button>
        <button class="btn-call-reject" onclick="endCall()">Raccrocher</button>
      </div>
    </div>

    <div id="messages-container"></div>

    <div id="form-bar">
      <button type="button" class="action-btn" onclick="openCamera()">📷</button>
      <label for="file-input" class="action-btn">📁</label>
      <input type="file" id="file-input" accept="image/*">

      <input id="input-message" autocomplete="off" placeholder="Message..." />
      <button id="btn-send" type="button" onclick="triggerSend()">OK</button>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay">
    <div class="settings-box">
      <div class="settings-title">Réglages</div>
      <div class="user-tag" id="my-username-display">Mon pseudo : -</div>
      <button class="btn-danger" onclick="clearBrowserCache()">🗑️ Effacer le cache</button>
      <button class="btn-cancel" onclick="closeSettings()">Fermer</button>
    </div>
  </div>

  <div id="camera-modal" class="modal-overlay">
    <video id="video-preview" autoplay playsinline></video>
    <div class="camera-controls">
      <button class="btn-close-cam" onclick="closeCamera()">Annuler</button>
      <button class="btn-snap" onclick="takeSnap()"></button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentFriend = null;

    const getStoredData = (key, fallback) => {
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : fallback;
    };

    const setStoredData = (key, value) => {
      localStorage.setItem(key, JSON.stringify(value));
    };

    let myUsername = localStorage.getItem('crypting_username');
    while (!myUsername || !myUsername.trim()) {
      myUsername = prompt("Entre ton pseudo (ex: iphone16, pc) :");
    }
    myUsername = myUsername.trim().toLowerCase(); // Normalisation stricte
    localStorage.setItem('crypting_username', myUsername);

    socket.emit('register user', myUsername);

    let friends = getStoredData('crypting_friends', []);
    let chats = getStoredData('crypting_chats', {});

    const openSettings = () => {
      document.getElementById('my-username-display').textContent = `Mon pseudo : ${myUsername}`;
      document.getElementById('settings-modal').style.display = 'flex';
    };

    const closeSettings = () => {
      document.getElementById('settings-modal').style.display = 'none';
    };

    const clearBrowserCache = () => {
      if (confirm("Effacer les contacts et discussions ?")) {
        localStorage.clear();
        location.reload();
      }
    };

    const renderFriendsList = () => {
      const listEl = document.getElementById('friends-list');
      listEl.innerHTML = '';

      if (friends.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Aucun ami.<br>Clique sur <b>"+ Ajouter"</b> pour démarrer.</div>';
        return;
      }

      friends.forEach(friendName => {
        const li = document.createElement('li');
        li.className = 'friend-item';

        const friendMsgs = chats[friendName] || [];
        const lastMsg = friendMsgs.length > 0 ? friendMsgs[friendMsgs.length - 1] : null;
        const lastText = lastMsg ? (lastMsg.image ? '📷 Snap' : lastMsg.text) : 'Nouvelle discussion';

        li.innerHTML = `
          <div class="avatar">${friendName.charAt(0).toUpperCase()}</div>
          <div class="friend-info">
            <div class="friend-name">${friendName}</div>
            <div class="last-message">${lastText}</div>
          </div>`;

        li.onclick = () => openChat(friendName);
        listEl.appendChild(li);
      });
    };

    const addFriend = () => {
      const name = prompt("Pseudo exact du contact :");
      if (name) {
        const cleanName = name.trim().toLowerCase();
        if (cleanName && cleanName !== myUsername) {
          if (!friends.includes(cleanName)) {
            friends.push(cleanName);
            setStoredData('crypting_friends', friends);
          }
          openChat(cleanName);
        }
      }
    };

    const openChat = (friendName) => {
      currentFriend = friendName;
      document.getElementById('active-user-title').textContent = currentFriend;
      document.getElementById('btn-start-call').style.display = 'inline-block';
      document.body.className = 'in-chat';
      renderMessages();
    };

    const closeChat = () => {
      document.body.className = '';
      currentFriend = null;
      document.getElementById('active-user-title').textContent = 'Sélectionne une discussion';
      document.getElementById('btn-start-call').style.display = 'none';
      renderFriendsList();
    };

    const renderMessages = () => {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';

      if (!currentFriend) return;

      const msgs = chats[currentFriend] || [];

      msgs.forEach(msg => {
        const div = document.createElement('div');
        div.className = `message-item ${msg.sender === 'me' ? 'me' : 'other'}`;

        if (msg.text) {
          const bubble = document.createElement('div');
          bubble.className = 'bubble';
          bubble.textContent = msg.text;
          div.appendChild(bubble);
        }

        if (msg.image) {
          const img = document.createElement('img');
          img.src = msg.image;
          img.className = 'chat-img';
          div.appendChild(img);
        }

        container.appendChild(div);
      });

      container.scrollTop = container.scrollHeight;
    };

    document.getElementById('input-message').onkeypress = (e) => {
      if (e.key === 'Enter') {
        triggerSend();
      }
    };

    const triggerSend = () => {
      const input = document.getElementById('input-message');
      const val = input.value.trim();

      if (val) {
        sendMessage(val, null);
        input.value = '';
      }
    };

    const sendMessage = (text, image) => {
      if (!currentFriend) {
        alert("Sélectionne une discussion d'abord !");
        return;
      }
      if (!chats[currentFriend]) chats[currentFriend] = [];

      chats[currentFriend].push({
        sender: 'me',
        text: text,
        image: image,
        timestamp: Date.now()
      });

      setStoredData('crypting_chats', chats);

      socket.emit('chat message', {
        sender: myUsername,
        target: currentFriend,
        text: text ? String(text) : null,
        image: image ? String(image) : null
      });

      renderMessages();
      renderFriendsList();
    };

    let peerConnection = null;
    let localStream = null;
    let incomingOffer = null;
    let callingFriend = null;
    let iceCandidatesQueue = [];

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    const unlockAudio = () => {
      const remoteAudio = document.getElementById('remote-audio');
      remoteAudio.play().catch(() => {});
    };

    const createPeerConnection = () => {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = (event) => {
        const remoteAudio = document.getElementById('remote-audio');
        if (event.streams && event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          remoteAudio.play().catch(() => {});
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && callingFriend) {
          socket.emit('ice-candidate', { target: callingFriend, candidate: event.candidate });
        }
      };
    };

    const processIceCandidates = async () => {
      while (iceCandidatesQueue.length > 0) {
        const cand = iceCandidatesQueue.shift();
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
        } catch (e) {}
      }
    };

    const startCall = async () => {
      if (!currentFriend) {
        alert("Sélectionne un ami à appeler.");
        return;
      }
      unlockAudio();
      callingFriend = currentFriend;
      document.getElementById('call-bar').style.display = 'block';
      document.getElementById('call-status-text').textContent = `Appel de ${callingFriend}...`;
      document.getElementById('btn-accept-call').style.display = 'none';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        createPeerConnection();

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('call-user', { target: callingFriend, offer: peerConnection.localDescription });
      } catch (err) {
        alert(`Erreur accès micro : ${err.message}`);
        endCall();
      }
    };

    socket.on('incoming-call', (data) => {
      callingFriend = data.from.toLowerCase();
      incomingOffer = data.offer;

      if (!currentFriend || currentFriend !== callingFriend) {
        openChat(callingFriend);
      }

      document.getElementById('call-bar').style.display = 'block';
      document.getElementById('call-status-text').textContent = `📞 Appel entrant de ${callingFriend}`;
      document.getElementById('btn-accept-call').style.display = 'inline-block';
    });

    const acceptCall = async () => {
      unlockAudio();
      document.getElementById('btn-accept-call').style.display = 'none';
      document.getElementById('call-status-text').textContent = `En ligne avec ${callingFriend}`;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        createPeerConnection();

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
        await processIceCandidates();

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('answer-call', { target: callingFriend, answer: peerConnection.localDescription });
      } catch (err) {
        alert(`Erreur accès micro : ${err.message}`);
        endCall();
      }
    };

    socket.on('call-answered', async (data) => {
      document.getElementById('call-status-text').textContent = `En ligne avec ${callingFriend}`;
      if (peerConnection && data.answer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        await processIceCandidates();
      }
    });

    socket.on('ice-candidate', async (data) => {
      if (data.candidate) {
        if (peerConnection && peerConnection.remoteDescription) {
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
          } catch (e) {}
        } else {
          iceCandidatesQueue.push(data.candidate);
        }
      }
    });

    socket.on('call-ended', () => {
      closeCallBar();
    });

    const endCall = () => {
      if (callingFriend) {
        socket.emit('end-call', { target: callingFriend });
      }
      closeCallBar();
    };

    const closeCallBar = () => {
      document.getElementById('call-bar').style.display = 'none';
      iceCandidatesQueue = [];
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      callingFriend = null;
    };

    socket.on('chat message', (data) => {
      const sender = data.sender.toLowerCase();
      if (!sender) return;

      if (!friends.includes(sender)) {
        friends.push(sender);
        setStoredData('crypting_friends', friends);
      }

      if (!chats[sender]) chats[sender] = [];

      chats[sender].push({
        sender: 'other',
        text: data.text,
        image: data.image,
        timestamp: Date.now()
      });

      setStoredData('crypting_chats', chats);

      if (currentFriend === sender) {
        renderMessages();
      }
      renderFriendsList();
    });

    socket.on('connect', () => {
      if (myUsername) {
        socket.emit('register user', myUsername);
      }
    });

    document.getElementById('file-input').onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxDim = 600; 
            let w = img.width, h = img.height;

            if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }

            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);

            sendMessage(null, canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    let mediaStream = null;
    const openCamera = async () => {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
          document.getElementById('video-preview').srcObject = mediaStream;
          document.getElementById('camera-modal').style.display = 'flex';
        } catch (err) {
          alert("Caméra indisponible ou permissions refusées.");
        }
      } else {
        alert("Utilise l'icône dossier 📁 pour sélectionner une photo.");
      }
    };

    const closeCamera = () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      document.getElementById('camera-modal').style.display = 'none';
    };

    const takeSnap = () => {
      const video = document.getElementById('video-preview');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 480;
      canvas.height = video.videoHeight || 640;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

      sendMessage(null, canvas.toDataURL('image/jpeg', 0.6));
      closeCamera();
    };

    renderFriendsList();
  </script>
</body>
</html>
