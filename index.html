<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Adapte la taille pour l'écran de l'iPhone 4 (320x480) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- Permet de masquer la barre Safari si ajoute sur l'ecran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Chat iPhone</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #e5e5ea; }
    #header { background: #007aff; color: white; text-align: center; padding: 12px; font-weight: bold; position: fixed; top: 0; width: 100%; z-index: 10; }
    #messages { list-style-type: none; margin: 50px 0 60px 0; padding: 10px; }
    #messages li { padding: 8px 12px; margin-bottom: 8px; background: white; border-radius: 12px; max-width: 80%; word-wrap: break-word; }
    #messages li.me { background: #34c759; color: white; margin-left: auto; }
    #form { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px; background: #f7f7f7; display: flex; border-top: 1px solid #ccc; }
    #pseudo { width: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-right: 5px; }
    #input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    #btn { padding: 8px 12px; margin-left: 5px; background: #007aff; color: white; border: none; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="header">Messagerie Rétro</div>

  <ul id="messages"></ul>

  <form id="form" action="">
    <input id="pseudo" placeholder="Nom" value="i4" />
    <input id="input" autocomplete="off" placeholder="Message..." />
    <button id="btn" type="submit">Envoyer</button>
  </form>

  <!-- Charge Socket.IO compatible avec les anciens navigateurs -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();
    var form = document.getElementById('form');
    var input = document.getElementById('input');
    var pseudo = document.getElementById('pseudo');
    var messages = document.getElementById('messages');

    form.onsubmit = function(e) {
      if (e && e.preventDefault) e.preventDefault();
      if (input.value) {
        socket.emit('chat message', {
          user: pseudo.value || 'Anonyme',
          text: input.value
        });
        input.value = '';
      }
      return false;
    };

    socket.on('chat message', function(data) {
      var item = document.createElement('li');
      if (data.user === pseudo.value) {
        item.className = 'me';
      }
      item.textContent = data.user + ' : ' + data.text;
      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
